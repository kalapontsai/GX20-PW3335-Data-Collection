<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>GX20 計算頁</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=11">
<script src="{{ url_for('static', filename='vendor/chart.umd.min.js') }}"></script>
<script src="{{ url_for('static', filename='vendor/chartjs-adapter-date-fns.bundle.min.js') }}"></script>
</head>
<body data-theme="light">

<header class="topbar">
  <span class="brand">GX20 計算頁</span>
  <a href="/" class="btn">返回主頁</a>
  <button id="loadSampleBtn" class="btn" title="載入內建範例（測試用）">載入範例</button>
  <button id="findBestBtn" class="btn" title="以 1440 分鐘（24H）窗口滑動掃描，找出 EF 最高的 24H 區段">尋找最佳數據</button>
  <button id="themeBtn" class="btn" title="切換明亮/暗黑">☀/🌙</button>
  <input type="text" id="resultFilename" class="note-box" maxlength="40" placeholder="結果檔名（預設 calculator_result.txt）" title="儲存結果時的檔名（40字）">
  <span class="conn">
    <span id="connDot" class="dot off"></span>
    <span id="connText">請載入 CSV</span>
  </span>
  <span class="last-ts" id="lastTs">—</span>
</header>

<main class="calc-main">
  <!-- 左上：圖表區（含 CSV 上傳 + chart + 兩條可拖曳 X-line） -->
  <section class="calc-chart-area">
    <div class="calc-upload-bar">
      <label>CSV 檔案：
        <input type="file" id="csvFileInput" accept=".csv,.xls,.xlsx">
      </label>
      <span class="file-info" id="fileInfo">（未載入）</span>
    </div>
    <div class="chart-pane">
      <canvas id="calcChart"></canvas>
      <!-- 兩條可拖曳 X-line（沿用 index.html 的 cursor overlay 結構） -->
      <div id="calcCursorOverlay" class="cursor-overlay" aria-hidden="true">
        <div id="calcCursorRange" class="cursor-range" hidden></div>
        <div id="calcCursorLeft"  class="cursor-bar cursor-left"  data-side="left"  hidden>
          <span class="cursor-time" id="calcCursorLeftTime"></span>
        </div>
        <div id="calcCursorRight" class="cursor-bar cursor-right" data-side="right" hidden>
          <span class="cursor-time" id="calcCursorRightTime"></span>
        </div>
      </div>
    </div>
  </section>

  <!-- 左下：結果文字框（對齊 index.html 的 right-side 風格） -->
  <section class="calc-result-area">
    <pre id="resultText">請載入 CSV 檔案以開始計算。</pre>
  </section>

  <!-- 右：參數面板 -->
  <aside class="calc-params">
    <h3>能耗參數</h3>

    <div class="param-card">
      <div class="row">
        <label>VF (L)：</label>
        <input type="number" id="paramVf" value="170" step="1">
      </div>
      <div class="row">
        <label>VR (L)：</label>
        <input type="number" id="paramVr" value="435" step="1">
      </div>
    </div>

    <div class="param-card">
      <div class="row">
        <label>F 溫度 (°C)：</label>
        <input type="number" id="paramFreezerTemp" value="-17.9" step="0.1">
      </div>
      <div class="row">
        <label>R 溫度 (°C)：</label>
        <input type="number" id="paramFridgeTemp" value="3.3" step="0.1">
      </div>
    </div>

    <div class="param-card">
      <div class="checkbox-row">
        <input type="checkbox" id="paramFanType" checked>
        <label for="paramFanType">風扇式（fan_type = 1）</label>
      </div>
      <div class="row">
        <label>OnOffTh：</label>
        <input type="number" id="paramOnOffTh" value="3.0" step="0.1">
      </div>
    </div>

    <div class="save-bar">
      <button id="saveResultBtn" class="btn" title="將結果文字框儲存為 .txt 檔（瀏覽器原生下載對話框）">儲存結果</button>
    </div>
  </aside>
</main>

<script src="{{ url_for('static', filename='js/chart-utils.js') }}?v=11"></script>
<script src="{{ url_for('static', filename='js/calculator.js') }}?v=11"></script>
</body>
</html>
