<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>GX20 行動版</title>
<script src="{{ url_for('static', filename='vendor/socket.io.min.js') }}"></script>
<style>
  /* v10.3 mobile 簡式版面：依使用者提供之範例圖 layout
     圖例重點：
       - 兩欄，欄寬 ~55/45（左欄略寬）
       - 表頭淡灰底、字稍粗
       - 資料列兩欄皆置中對齊、字體 ~15-16px
       - 行高 ~44-48px、cell padding ~12px
       - 極簡：無 hero / 無多餘強調色
       - 工位切換必放（圖未顯示但使用者文字要求），採薄一條 sticky header 不搶眼
  */
  :root {
    --bg:        #ffffff;
    --fg:        #000000;
    --header-bg: #f2f2f2;   /* 表頭底色，照圖 */
    --row-line:  #e5e5e5;   /* 資料列分隔線 */
    --muted:     #8a8a8a;   /* 連線狀態 / footer 小字 */
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  /* 工位切換列：極薄、貼齊表格上沿，不搶表格焦點 */
  header.bar {
    position: sticky; top: 0; z-index: 10;
    background: var(--bg);
    border-bottom: 1px solid var(--row-line);
    padding: 8px 12px;
    display: flex; align-items: center; gap: 10px;
  }
  header.bar select {
    flex: 1; min-width: 0;
    font-size: 15px;
    padding: 6px 8px;
    border: 1px solid var(--row-line);
    border-radius: 6px;
    background: var(--bg);
    color: var(--fg);
    font-family: inherit;
  }
  /* 連線狀態（極小、貼右上） */
  header.bar .conn {
    font-size: 12px; color: var(--muted);
    display: flex; align-items: center; gap: 4px;
    white-space: nowrap;
  }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #999;
  }
  .dot.on  { background: #2da44e; }
  .dot.off { background: #cf222e; }

  /* 表格：照圖極簡置中型 */
  main {
    padding: 0;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;        /* 鎖欄寬 55/45 */
  }
  thead th {
    background: var(--header-bg);
    border-bottom: 1px solid var(--row-line);
    padding: 12px 14px;
    text-align: center;
    font-size: 16px;
    font-weight: 500;            /* medium，圖感 */
    color: #1a1a1a;
  }
  thead th:nth-child(1) { width: 55%; }
  thead th:nth-child(2) { width: 45%; }

  tbody td {
    padding: 12px 14px;          /* 圖 cell 約 12px */
    border-bottom: 1px solid var(--row-line);
    text-align: center;          /* 圖兩欄皆置中 */
    vertical-align: middle;
    font-size: 15px;             /* 圖 ~15-16px */
    line-height: 1.4;
    min-height: 44px;            /* 圖行高 ~44-48px */
  }
  tbody td.ch-name {
    font-weight: 500;            /* T01–T10 稍粗 */
    color: #1a1a1a;
  }
  tbody td.ch-val {
    font-weight: 400;            /* 數字 regular */
    color: #000;
    font-variant-numeric: tabular-nums;
  }
  tbody td.ch-val.none { color: var(--muted); }  /* 空值 → 灰色 "—" */
  /* 圖例空值留白（無 placeholder）；用 — 但調淡色讓不搶眼 */

  footer {
    padding: 10px 14px;
    font-size: 12px;
    color: var(--muted);
    text-align: center;
    border-top: 1px solid var(--row-line);
  }
</style>
</head>
<body>

<header class="bar">
  <select id="stationSelect" aria-label="工位切換">
    {% for s in stations %}<option value="{{ s }}">{{ s }}</option>{% endfor %}
  </select>
  <span class="conn" title="Socket.IO 連線狀態">
    <span id="connDot" class="dot off"></span>
    <span id="connText">連線中</span>
  </span>
</header>

<main>
  <table id="readoutTable" aria-label="channel 讀值">
    <thead>
      <tr>
        <th>channel</th>
        <th>讀值 (°C)</th>
      </tr>
    </thead>
    <tbody id="readoutBody">
      <!-- 由 mobile.js 動態產生 20 列 -->
    </tbody>
  </table>
</main>

<footer>
  <span id="lastTs">—</span>
</footer>

<script src="{{ url_for('static', filename='js/mobile.js') }}?v=2"></script>
</body>
</html>
