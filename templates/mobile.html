<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>GX20 行動版</title>
<script src="{{ url_for('static', filename='vendor/socket.io.min.js') }}"></script>
<style>
  /* v10.3 mobile 簡式版面：只工位下拉 + channel 讀值表
     設計原則：
       - 預設字體就要夠大（手機可閱讀），不提供調整 UI
       - 桌機/手機同版面，不做響應式切換
       - 配色跟主頁一致（CSS variables 由 main.js 主題系統設定，
         但 mobile 獨立頁，用預設亮色避免主題不同步困擾）*/
  :root {
    --bg:      #ffffff;
    --fg:      #1f2328;
    --muted:   #57606a;
    --border:  #d0d7de;
    --hover:   #f6f8fa;
    --accent:  #0969da;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC",
                 "Microsoft JhengHei", "Noto Sans TC", sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    padding: 14px 16px;
    display: flex; align-items: center; gap: 12px;
  }
  header h1 {
    margin: 0; font-size: 1.15rem; font-weight: 600;
    white-space: nowrap;
  }
  header select {
    flex: 1; min-width: 0;
    font-size: 1.1rem;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg);
    color: var(--fg);
  }
  /* 連線指示（小型 dot） */
  .conn {
    display: flex; align-items: center; gap: 6px;
    font-size: 0.85rem; color: var(--muted);
  }
  .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: #999;
  }
  .dot.on  { background: #2da44e; }
  .dot.off { background: #cf222e; }

  main {
    padding: 0;
    /* 表格內容可能 > 螢幕高度，讓 main 區可滾動；header 固定在上 */
    overflow-x: auto;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 1.4rem;        /* 讀值字體 — 主要可閱讀元素 */
  }
  thead th {
    position: sticky; top: 0;
    background: var(--bg);
    border-bottom: 2px solid var(--border);
    padding: 12px 12px;
    text-align: left;
    font-size: 1rem;
    font-weight: 600;
    color: var(--muted);
  }
  tbody td {
    padding: 14px 12px;
    border-bottom: 1px solid var(--border);
    vertical-align: middle;
  }
  tbody tr:hover { background: var(--hover); }
  td.ch-name {
    font-size: 1.1rem;
    color: var(--muted);
    width: 30%;
    white-space: nowrap;
  }
  td.ch-val {
    font-size: 1.6rem;          /* 讀值再大一點 */
    font-weight: 500;
    font-variant-numeric: tabular-nums;
    text-align: right;
    width: 70%;
  }
  td.ch-val.none { color: var(--muted); font-weight: 400; }
  /* ch_visibility 停用的 row：淡化但仍顯示（保留資料完整性） */
  tr.disabled td { color: #b1b1b1; }
  tr.disabled td.ch-val { font-weight: 400; }

  footer {
    padding: 12px 16px;
    font-size: 0.85rem;
    color: var(--muted);
    text-align: center;
    border-top: 1px solid var(--border);
  }
  /* 窄螢幕（手機）：縮小 padding、字體稍減 */
  @media (max-width: 480px) {
    header { padding: 10px 12px; gap: 8px; }
    header h1 { font-size: 1rem; }
    thead th { padding: 10px 10px; }
    tbody td { padding: 12px 10px; }
    td.ch-val { font-size: 1.5rem; }
  }
</style>
</head>
<body>

<header>
  <h1>GX20</h1>
  <select id="stationSelect" aria-label="工位切換">
    {% for s in stations %}<option value="{{ s }}">{{ s }}</option>{% endfor %}
  </select>
  <span class="conn" title="Socket.IO 連線狀態">
    <span id="connDot" class="dot off"></span>
    <span id="connText">連線中</span>
  </span>
</header>

<main>
  <table id="readoutTable" aria-label="channel 讀值">
    <thead>
      <tr>
        <th>channel</th>
        <th style="text-align:right;">讀值 (°C)</th>
      </tr>
    </thead>
    <tbody id="readoutBody">
      <!-- 由 mobile.js 動態產生 20 列 -->
    </tbody>
  </table>
</main>

<footer>
  <span id="lastTs">—</span>
</footer>

<script src="{{ url_for('static', filename='js/mobile.js') }}?v=1"></script>
</body>
</html>
